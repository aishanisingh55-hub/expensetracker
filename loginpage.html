<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .login-container {
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            animation: scaleIn 0.5s ease-out;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        body.dark-mode .login-container {
            background: #1e1e2f;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 1.1em;
        }

        body.dark-mode .login-header p {
            color: #9ca3af;
        }

        .form-container {
            animation: fadeIn 0.5s ease-out;
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }

        body.dark-mode .input-group label {
            color: #e0e0e0;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            width: 20px;
            height: 20px;
            color: #666;
        }

        body.dark-mode .password-toggle {
            color: #9ca3af;
        }

        .password-toggle:hover {
            color: #667eea;
            transform: translateY(-50%) scale(1.1);
        }

        body.dark-mode .password-toggle:hover {
            color: #8b9bff;
        }

        .password-toggle svg {
            width: 100%;
            height: 100%;
            stroke-width: 2;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        body.dark-mode .input-group input {
            background: #2d3748;
            color: #e0e0e0;
            border-color: #4a5568;
        }

        body.dark-mode .input-group input::placeholder {
            color: #9ca3af;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        body.dark-mode .input-group input:focus {
            background: #374151;
            border-color: #667eea;
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 15px;
        }

        body.dark-mode .toggle-form {
            color: #9ca3af;
        }

        .toggle-form a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        body.dark-mode .toggle-form a {
            color: #8b9bff;
        }

        .toggle-form a:hover {
            text-decoration: underline;
            color: #764ba2;
        }

        .error-message,
        .success-message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            color: white;
            font-weight: 500;
            animation: fadeIn 0.3s ease-out;
        }

        .error-message {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
        }

        .success-message {
            background: linear-gradient(135deg, #51cf66, #37b24d);
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            display: none;
        }

        body.dark-mode .password-requirements {
            color: #9ca3af;
        }

        #signupForm .password-requirements {
            display: block;
        }

        .caps-lock-warning {
            font-size: 12px;
            color: #ff9800;
            margin-top: 5px;
            display: none;
            font-weight: 500;
        }

        body.dark-mode .caps-lock-warning {
            color: #ffa726;
        }

        /* Dark Mode Toggle Button */
        .theme-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 99999;
            animation: float 3s ease-in-out infinite;
            pointer-events: all;
        }

        .theme-toggle:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        body.dark-mode .theme-toggle {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            box-shadow: 0 8px 25px rgba(255, 216, 155, 0.4);
        }

        body.dark-mode .theme-toggle:hover {
            box-shadow: 0 12px 35px rgba(255, 216, 155, 0.6);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle" type="button">☀️</button>

    <div class="login-container">
        <div class="login-header">
            <h1>Expense Tracker</h1>
            <p id="formTitle">Welcome Back!</p>
        </div>

        <div id="errorMsg" class="error-message"></div>
        <div id="successMsg" class="success-message"></div>

        <!-- Login Form -->
        <div id="loginForm" class="form-container">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Enter your password" onkeyup="checkCapsLock(event, 'loginCapsWarning')">
                    <span class="password-toggle" onmousedown="showPassword('loginPassword')" onmouseup="hidePassword('loginPassword')" onmouseleave="hidePassword('loginPassword')">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
                <div class="caps-lock-warning" id="loginCapsWarning">Caps Lock is on</div>
            </div>
            <button class="login-btn" onclick="handleLogin()">Login</button>
            <div class="toggle-form">
                Don't have an account? <a onclick="toggleForm()">Sign Up</a>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="signupForm" class="form-container" style="display: none;">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="signupUsername" placeholder="Choose a username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="signupPassword" placeholder="Choose a password" onkeyup="checkCapsLock(event, 'signupCapsWarning')">
                    <span class="password-toggle" onmousedown="showPassword('signupPassword')" onmouseup="hidePassword('signupPassword')" onmouseleave="hidePassword('signupPassword')">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
                <div class="caps-lock-warning" id="signupCapsWarning">Caps Lock is on</div>
                <div class="password-requirements">Password must be at least 4 characters</div>
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" onkeyup="checkCapsLock(event, 'confirmCapsWarning')">
                    <span class="password-toggle" onmousedown="showPassword('signupConfirmPassword')" onmouseup="hidePassword('signupConfirmPassword')" onmouseleave="hidePassword('signupConfirmPassword')">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
                <div class="caps-lock-warning" id="confirmCapsWarning">Caps Lock is on</div>
            </div>
            <button class="login-btn" onclick="handleSignup()">Sign Up</button>
            <div class="toggle-form">
                Already have an account? <a onclick="toggleForm()">Login</a>
            </div>
        </div>
    </div>

    <script src="loginscript.js"></script>
</body>
</html>
